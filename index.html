<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GXO SKU Information</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f4f4;
    }

    /* Header */
    .header {
      background-color: #FE3C03; /* GXO red */
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .header-subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Content */
    .container {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    th {
      background-color: #2b2b2b;
      color: white;
      text-align: left;
      padding: 12px;
      font-size: 14px;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 16px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
      width: 40%;
    }
  </style>
</head>

<body>

  <!-- GXO Header -->
  <div class="header">
    <div>
      <div class="header-title">GXO</div>
      <div class="header-subtitle">Logistics at full potential</div>
    </div>
  </div>

  <!-- SKU Table -->
  <div class="container">
    <table>
      <tr>
        <th colspan="2">SKU Details</th>
      </tr>
      <tr>
        <td class="label">SKU ID</td>
        <td id="sku"></td>
      </tr>
      <tr>
        <td class="label">Quantity</td>
        <td id="qty"></td>
      </tr>
    </table>
  </div>

  <!-- Read QR parameters -->
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("sku").textContent = params.get("sku") || "-";
    document.getElementById("qty").textContent = params.get("qty") || "-";
  </script>

</body>
</html>
