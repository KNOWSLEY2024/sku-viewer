<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU Information</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f4f4;
    }

    /* HEADER */
    .header {
      background-color: #FE3C03; /* GXO red */
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logos img {
      height: 42px;
      width: auto;
      display: block;
      background: transparent;
    }

    .gxo-text {
      text-align: right;
    }

    .gxo-text .title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1;
      color: white;
    }

    .gxo-text .subtitle {
      font-size: 12px;
      opacity: 0.9;
      color: white;
    }

    /* CONTENT */
    .container {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    th {
      background-color: #2b2b2b;
      color: white;
      padding: 12px;
      text-align: left;
      font-size: 15px;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 16px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .sku-col {
      font-weight: bold;
      color: #555;
      width: 70%;
    }

    .qty-col {
      width: 30%;
      text-align: right;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logos">
      <img
        src="https://upload.wikimedia.org/wikipedia/en/a/ad/Castore_brand_logo.svg"
        alt="Castore Logo">
    </div>

   <div class="header">
    <div class="logos">
      <img
        src="https://gxo.com/wp-content/uploads/2021/07/GXO_tagline_rgb_DigitalUse.png"
        alt="GXO Logo">
    </div>

  <!-- TABLE -->
  <div class="container">
    <table>
      <thead>
        <tr>
          <th>SKU ID</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>

  <!-- SCRIPT -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const rawData = params.get("data");

    if (rawData) {
      const rows = rawData.split("\n");

      rows.forEach(row => {
        if (!row.trim()) return;

        const parts = row.split("\t");
        const sku = parts[0] || "-";
        const qty = parts[1] || "-";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="sku-col">${sku}</td>
          <td class="qty-col">${qty}</td>
        `;

        document.getElementById("tableBody").appendChild(tr);
      });
    }
  </script>

</body>
</html>
